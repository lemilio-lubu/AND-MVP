name: Deploy NextJS

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Limpiar espacio en EC2 ANTES de copiar
      - name: Free up disk space on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Espacio antes de limpiar:"
            df -h

            pm2 flush || true
            npm cache clean --force || true
            sudo journalctl --vacuum-time=1d || true
            sudo apt-get clean || true
            sudo rm -rf /tmp/* || true

            # Eliminar dependencias y build anterior
            rm -rf /home/ubuntu/app/frontend/node_modules
            rm -rf /home/ubuntu/app/frontend/.next

            echo "Espacio después de limpiar:"
            df -h

      # Copiar únicamente código fuente
      - name: Deploy source to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/ubuntu/app/frontend"
          exclude: |
            node_modules
            .next
            .git
            .env
            .env.local

      # Instalar, construir y reiniciar
      - name: Build and restart NextJS on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/ubuntu/app/frontend

            echo "Configurando variables de entorno..."
            cp /home/ubuntu/app/.env.front .env

            echo "Instalando dependencias..."
            npm ci

            echo "Construyendo NextJS..."
            npm run build

            echo "Reiniciando PM2..."
            pm2 restart next-app --cwd /home/ubuntu/app/frontend || \
              pm2 start npm --name "next-app" --cwd /home/ubuntu/app/frontend -- start

            pm2 save

            echo "Deploy completado."

            echo "Espacio disponible:"
            df -h